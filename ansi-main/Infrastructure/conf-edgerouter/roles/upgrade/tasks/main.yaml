# ----------------------------
# Stage v2 (ONLY if needed)
# Upgrade flow: add system image then reboot to apply [1](https://barreras-it.com/announcements/39/EdgeRouter-3.0-Upgrade-Guide-New-Interface-WireGuard-and-Security.html)
# ----------------------------
- block:
    - name: "Upload firmware v2"
      ansible.builtin.copy:
        src: "{{ v2_src }}"
        dest: "{{ remote_path }}/{{ v2_file }}"
        mode: "0644"

    - name: "Stage v2 image (add system image)"
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper add system image {{ remote_path }}/{{ v2_file }}
      register: stage_v2
      changed_when: true

    - name: "Print v2 stage output"
      ansible.builtin.debug:
        var: stage_v2.stdout

    - name: "Reboot after v2 stage (apply image)"
      ansible.builtin.shell: |
        set -o pipefail
        printf 'y\n' | /opt/vyatta/bin/vyatta-op-cmd-wrapper reboot >/dev/null 2>&1 || true
        sudo -n /sbin/reboot >/dev/null 2>&1 || true
        /sbin/reboot >/dev/null 2>&1 || true
      async: 1
      poll: 0
      changed_when: true

    - name: "Wait for SSH to drop (v2 reboot)"
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: stopped
        timeout: "{{ ssh_drop_timeout }}"
      delegate_to: localhost

    - name: "Wait for router after v2 reboot"
      ansible.builtin.wait_for_connection:
        delay: "{{ reboot_delay }}"
        timeout: "{{ reboot_timeout }}"
  when: need_v2

# ----------------------------
# Final verification
# ----------------------------
- name: "Final - show version"
  ansible.builtin.command:
    cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show version
  register: final_ver
  changed_when: false

- name: "Final - show system image"
  ansible.builtin.command:
    cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show system image
  register: final_images
  changed_when: false

- name: "Print final state"
  ansible.builtin.debug:
    msg:
      - "{{ final_ver.stdout }}"
      - "{{ final_images.stdout }}"
